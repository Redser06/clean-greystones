name: CI

on:
  pull_request:
    branches:
      - main
    paths:
      - 'firestore.rules'
      - 'src/**'
      - 'package.json'
      - 'package-lock.json'
      - 'tsconfig*.json'
      - '.github/workflows/**'

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run Typecheck
        run: npm run typecheck

      - name: Run Tests
        run: npm test

      - name: Run Firestore rules tests
        run: npm run test:rules

      - name: Build production bundle
        env:
          VITE_FIREBASE_PROJECT_ID: rapid-prototyping-4134c
          VITE_FIREBASE_STORAGE_BUCKET: rapid-prototyping-4134c.firebasestorage.app
          VITE_FIREBASE_AUTH_DOMAIN: rapid-prototyping-4134c.firebaseapp.com
          VITE_FIREBASE_MESSAGING_SENDER_ID: '285060831800'
        run: npm run build
